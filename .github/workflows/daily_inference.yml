name: Daily AQI Forecast Pipeline
 
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
 
jobs:
  run-pipeline:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
 
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn joblib pyarrow requests
 
      - name: Fetch Live Data
        run: python fetch_live_data.py
 
      - name: Train Models
        run: python train_model.py
 
      - name: Generate Predictions
        run: python predict_72h.py
 
      # NEW: fails the workflow (and blocks the commit below) if the
      # freshly trained model or its predictions look broken.
      - name: Health Check (blocks bad deploys)
        run: python check_model_health.py
 
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ models/
          git diff-index --quiet HEAD || git commit -m "Automated daily AQI update [skip ci]"
          git push
 
