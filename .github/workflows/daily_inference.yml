name: Daily AQI Forecast Pipeline

on:
  schedule:
    # Runs automatically every day at 02:00 UTC (07:00 AM Pakistan Standard Time)
    - cron: '0 2 * * *'
  # Allows you to manually trigger the pipeline anytime from the GitHub website
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Download your repository code onto the GitHub server
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Python 3.11 environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Step 3: Install all required Python packages
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn joblib pyarrow requests

      # Step 4: Run your ingestion script to pull live data
      - name: Fetch Live Data
        run: python fetch_live_data.py

      # Step 5: Retrain models with latest observations
      - name: Train Models
        run: python train_model.py

      # Step 6: Generate the 72-hour forecast artifacts
      - name: Generate Predictions
        run: python predict_72h.py

      # Step 7: Commit updated files back to your GitHub repository
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ models/
          git diff-index --quiet HEAD || git commit -m "Automated daily AQI update [skip ci]"
          git push